name: Trigger site rebuild

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, pinned, unpinned]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content-changed event to shadow-llm-web
        env:
          # Personal access token (classic or fine-grained) with `repo` scope
          # on Shadow-LLM/shadow-llm-web. Store as a secret in this repo.
          DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Shadow-LLM/shadow-llm-web/dispatches \
            -d '{"event_type":"content-changed","client_payload":{"source":"failure-cases","event":"${{ github.event_name }}","number":"${{ github.event.issue.number }}"}}'
